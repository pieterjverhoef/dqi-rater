<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DQI Rater — Dashboard</title>
  <link rel="stylesheet" href="css/style.css?v=dqi-v2" />
</head>
<body class="dashboard-page">

  <header class="dash-header">
    <div class="header-left">
      <button id="btn-logout" class="btn-text">← Logout</button>
      <span class="user-display">Pieter — Admin</span>
    </div>
    <h1 class="dash-title">Dashboard</h1>
    <div class="header-right">
      <button id="btn-export-csv" class="btn btn-sm">Export CSV</button>
      <button id="btn-export-json" class="btn btn-sm">Export JSON</button>
      <button id="btn-deep-analysis" class="btn btn-sm btn-deep-analysis-header hidden">Deep Analysis</button>
    </div>
  </header>

  <main class="dash-main">

    <!-- Set selector -->
    <div id="set-selector" class="dash-section">
      <h2>Select Image Set</h2>
      <div id="set-list" class="set-list"></div>
      <p id="no-sets-msg" class="hint hidden">No image sets available yet.</p>
    </div>

    <!-- Back button (hidden until set selected) -->
    <div id="change-set-bar" class="hidden" style="margin-bottom:16px;">
      <button id="btn-change-set" class="btn-change-set">← Change Set</button>
    </div>

    <!-- Summary cards (hidden until set is selected) -->
    <div id="dash-content" class="hidden">

      <div class="summary-cards">
        <div class="summary-card">
          <span class="card-value" id="card-total">—</span>
          <span class="card-label">Total images</span>
        </div>
        <div class="summary-card">
          <span class="card-value" id="card-rated">—</span>
          <span class="card-label">Fully rated</span>
        </div>
        <div class="summary-card">
          <span class="card-value" id="card-agreement">—</span>
          <span class="card-label">Full agreement</span>
        </div>
        <div class="summary-card">
          <span class="card-value" id="card-avg-diff">—</span>
          <span class="card-label">Avg. rater vs algorithm</span>
        </div>
      </div>

      <!-- Per-image table -->
      <div class="table-wrap">
        <table id="dash-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>
                Algorithm
                <select id="moran-version-select" class="moran-version-select hidden" title="Select Moran version">
                  <option value="v1">V1</option>
                  <option value="v2" selected>V2</option>
                  <option value="v3">V3</option>
                </select>
              </th>
              <th>Cobus</th>
              <th>Marius</th>
              <th>Agreement</th>
              <th>Avg vs Algo</th>
            </tr>
          </thead>
          <tbody id="dash-tbody"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="js/dashboard.js?v=dqi-v2"></script>
</body>
</html>
